<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTAL FORCE - File Gateway</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Space Grotesk', sans-serif; }
        body { background: #050508; overflow-x: hidden; }

        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0;
            background: radial-gradient(circle at 20% 30%, rgba(220, 38, 38, 0.2) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(153, 27, 27, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(24, 24, 27, 0.8) 0%, transparent 70%);
            filter: blur(60px); animation: meshMove 12s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.1) translate(-2%, 3%); }
            100% { transform: scale(1.05) translate(2%, -2%); }
        }

        .glass-cyber {
            background: rgba(18, 18, 23, 0.85); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.25rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(239, 68, 68, 0.05);
        }

        .timer-box {
            position: relative; width: 100px; height: 100px; margin: 0 auto 1rem;
            display: flex; align-items: center; justify-content: center;
        }

        .timer-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .timer-circle-bg { fill: none; stroke: #1f2937; stroke-width: 6; }
        .timer-circle-progress {
            fill: none; stroke: #ef4444; stroke-width: 6;
            stroke-dasharray: 283; stroke-dashoffset: 0; stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        .ad-container-box {
            width: 100%; min-height: 85px; background: rgba(10, 10, 14, 0.6);
            border: 1px dashed rgba(239, 68, 68, 0.3); border-radius: 0.85rem;
            padding: 8px; margin-bottom: 0.75rem; overflow: hidden; position: relative;
        }

        .btn-cyber-disabled { background: #27272a; color: #71717a; cursor: not-allowed; border-radius: 0.85rem; }
        .btn-cyber-active {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            border-radius: 0.85rem; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            transition: all 0.25s ease;
        }
        .btn-cyber-active:hover { box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); transform: translateY(-2px); }

        .btn-blue-active {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border-radius: 0.85rem; box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
            transition: all 0.25s ease;
        }
        .btn-blue-active:hover { box-shadow: 0 0 25px rgba(37, 99, 235, 0.8); transform: translateY(-2px); }

        .glow-title { text-shadow: 0 0 12px rgba(239, 68, 68, 0.6); }

        .click-ad-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; cursor: pointer; background: rgba(239, 68, 68, 0.15);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(239, 68, 68, 0.6); border-radius: 0.85rem;
        }
    </style>
</head>
<body class="text-zinc-100 min-h-screen flex items-center justify-center p-4 relative">

    <div class="bg-mesh"></div>

    <div class="max-w-md w-full glass-cyber p-6 relative z-10 my-6 text-center">
        
        <!-- Header -->
        <div class="mb-4">
            <h1 class="text-2xl font-black text-red-500 tracking-wider flex items-center justify-center gap-2 glow-title">
                <i class="fa-solid fa-bolt animate-pulse"></i> BRUTAL FORCE
            </h1>
            <p class="text-[11px] text-zinc-400 font-mono tracking-widest mt-0.5 uppercase">
                Secure Direct Gateway
            </p>
        </div>

        <!-- Setup Video Badge (Coming Soon) -->
        <div class="bg-zinc-900/90 border border-yellow-500/30 rounded-xl p-2.5 mb-4 flex items-center justify-between">
            <div class="flex items-center gap-2 text-xs font-bold text-yellow-400">
                <i class="fa-solid fa-clapperboard text-yellow-500"></i>
                <span>Setup Video:</span>
            </div>
            <span class="bg-yellow-500/20 text-yellow-300 text-[10px] font-mono font-bold px-2.5 py-1 rounded-md border border-yellow-500/40 animate-pulse">
                COMING SOON ⏳
            </span>
        </div>

        <!-- Master 30s Timer -->
        <div class="timer-box">
            <svg class="timer-svg" viewBox="0 0 100 100">
                <circle class="timer-circle-bg" cx="50" cy="50" r="45"></circle>
                <circle class="timer-circle-progress" id="progress-bar" cx="50" cy="50" r="45"></circle>
            </svg>
            <div class="absolute text-2xl font-black text-white" id="timer-text">30</div>
        </div>

        <!-- Stage Box -->
        <div class="mb-3 p-2 bg-red-950/30 border border-red-500/30 rounded-lg" id="stage-box">
            <p class="text-[11px] font-bold text-red-400 uppercase tracking-wide" id="stage-text">
                <i class="fa-solid fa-spinner fa-spin mr-1"></i> Stage 1: Running Timer (10s)
            </p>
        </div>

        <!-- Primary Interactive Ad Unit -->
        <div class="ad-container-box">
            <div class="click-ad-overlay" id="ad-overlay" onclick="handleStageAdClick()" style="display: none;">
                <span class="bg-red-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-full shadow-lg uppercase tracking-wider animate-bounce flex items-center gap-1">
                    <i class="fa-solid fa-lock-open"></i> <span id="overlay-text">Click Ad to Resume Timer</span>
                </span>
            </div>
            <iframe data-aa='2453083' src='//acceptable.a-ads.com/2453083/?size=Adaptive'
                    style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto;'></iframe>
        </div>

        <!-- Action Button 1: Backup ROM -->
        <div class="mb-3">
            <button id="rom-btn" class="btn-cyber-disabled w-full py-3 text-center text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2" disabled>
                <i class="fa-solid fa-lock" id="rom-icon"></i>
                <span id="rom-btn-text">Backup ROM (30s Wait)</span>
            </button>
        </div>

        <!-- Action Button 2: Vphone Bypass Non Root -->
        <div class="mb-4">
            <button id="app-btn" class="btn-cyber-disabled w-full py-3 text-center text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2" disabled>
                <i class="fa-solid fa-lock" id="app-icon"></i>
                <span id="app-btn-text">Vphone Bypass Non Root (30s Wait)</span>
            </button>
        </div>

        <!-- Secondary Ad Unit -->
        <div class="ad-container-box">
            <iframe data-aa='2453083' src='//acceptable.a-ads.com/2453083/?size=Adaptive&v=2'
                    style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto;'></iframe>
        </div>

        <div class="mt-2 text-[10px] text-zinc-500 font-mono">
            Powered by Brutal Force Direct Gateway
        </div>

    </div>

    <script>
        const ROM_DOWNLOAD_URL = "https://drive.google.com/file/d/1xr1Q_6LjKQeT_TvKlgibZ0i1UXqCunR2/view?usp=drivesdk";
        const APP_DOWNLOAD_URL = "https://drive.google.com/file/d/14coHZpgMAJQExqNYxWkGtc_zs_JbImMb/view?usp=drivesdk";
        const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/gsc5uhf5i?key=d23f866fa93aa3e6aa5c4b4754586d20";

        let secondsLeft = 30;
        let isPaused = false;
        let currentStage = 1;

        const timerText = document.getElementById("timer-text");
        const progressBar = document.getElementById("progress-bar");
        const stageBox = document.getElementById("stage-box");
        const stageText = document.getElementById("stage-text");
        const adOverlay = document.getElementById("ad-overlay");
        const overlayText = document.getElementById("overlay-text");

        const romBtn = document.getElementById("rom-btn");
        const romIcon = document.getElementById("rom-icon");
        const romBtnText = document.getElementById("rom-btn-text");

        const appBtn = document.getElementById("app-btn");
        const appIcon = document.getElementById("app-icon");
        const appBtnText = document.getElementById("app-btn-text");

        const totalDash = 283;

        // Master 30s Timer Cycle
        const timerInterval = setInterval(() => {
            if (isPaused) return;

            secondsLeft--;
            timerText.innerText = secondsLeft;

            const offset = totalDash - (secondsLeft / 30) * totalDash;
            progressBar.style.strokeDashoffset = offset;

            if (secondsLeft === 20 && currentStage === 1) {
                pauseForAdRequirement(2, "Stage 1 Clear! Click Ad To Start Stage 2");
            } else if (secondsLeft === 10 && currentStage === 2) {
                pauseForAdRequirement(3, "Stage 2 Clear! Click Ad To Unlock Final Stage");
            } else if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                finishUnlockProcess();
            }
        }, 1000);

        function pauseForAdRequirement(nextStage, message) {
            isPaused = true;
            currentStage = nextStage;
            
            overlayText.innerText = message;
            adOverlay.style.display = "flex";

            stageBox.className = "mb-3 p-2 bg-yellow-950/40 border border-yellow-500/40 rounded-lg";
            stageText.className = "text-[11px] font-bold text-yellow-400 uppercase tracking-wide";
            stageText.innerHTML = `<i class="fa-solid fa-hand mr-1"></i> PAUSED: Click Ad Overlay Below to Continue`;
        }

        function handleStageAdClick() {
            window.open(ADSTERRA_DIRECT_LINK, '_blank');

            adOverlay.style.display = "none";
            isPaused = false;

            stageBox.className = "mb-3 p-2 bg-red-950/30 border border-red-500/30 rounded-lg";
            stageText.className = "text-[11px] font-bold text-red-400 uppercase tracking-wide";
            stageText.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Stage ${currentStage} Running...`;
        }

        function finishUnlockProcess() {
            stageBox.className = "mb-3 p-2 bg-green-950/40 border border-green-500/40 rounded-lg";
            stageText.className = "text-[11px] font-bold text-green-400 uppercase tracking-wide";
            stageText.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> ALL FILES UNLOCKED!`;

            // Unlock Backup ROM
            romBtn.disabled = false;
            romBtn.className = "btn-cyber-active w-full py-3 text-center text-white text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer";
            romIcon.className = "fa-solid fa-download";
            romBtnText.innerText = "DOWNLOAD BACKUP ROM (.7Z)";

            // Unlock Vphone Bypass Non Root
            appBtn.disabled = false;
            appBtn.className = "btn-blue-active w-full py-3 text-center text-white text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer";
            appIcon.className = "fa-solid fa-download";
            appBtnText.innerText = "DOWNLOAD VPHONE BYPASS NON ROOT (.APK)";

            romBtn.addEventListener("click", () => window.location.href = ROM_DOWNLOAD_URL);
            appBtn.addEventListener("click", () => window.location.href = APP_DOWNLOAD_URL);
        }
    </script>
</body>
</html>
