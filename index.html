<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutal Drive - Direct Host</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .zoom-in { animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-red-500 selection:text-white">

    <div id="mainContainer" class="max-w-lg w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl zoom-in relative overflow-hidden my-6">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-red-500 tracking-wider flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt"></i> BRUTAL DRIVE
            </h1>
            <p class="text-xs text-zinc-400 mt-1">Direct Upload & High-Speed Gateway</p>
        </div>

        <!-- UPLOADER VIEW -->
        <div id="uploadView" class="space-y-5 fade-in">
            <div id="dropZone" class="border-2 border-dashed border-zinc-700 hover:border-red-500 bg-zinc-950/50 hover:bg-zinc-950 rounded-xl p-8 text-center cursor-pointer transition-all duration-300">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-zinc-500 mb-3 transition-transform hover:scale-110"></i>
                <p class="text-sm text-zinc-200 font-bold">Click or Drag File to Upload</p>
                <p class="text-xs text-zinc-500 mt-1">Direct CORS Upload | Up to 200MB</p>
                <input type="file" id="fileInput" class="hidden">
            </div>

            <!-- Upload Progress Bar -->
            <div id="progressBox" class="hidden space-y-2 bg-zinc-950 p-4 border border-zinc-800 rounded-xl fade-in">
                <div class="flex justify-between text-xs font-semibold text-zinc-300">
                    <span id="fileName" class="truncate max-w-[200px]">Uploading...</span>
                    <span id="percentText" class="text-red-500">0%</span>
                </div>
                <div class="w-full bg-zinc-800 rounded-full h-2.5 overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-red-600 to-red-500 h-full w-0 transition-all duration-150"></div>
                </div>
            </div>

            <!-- Generated Link View -->
            <div id="resultBox" class="hidden space-y-3 bg-zinc-950 p-4 border border-zinc-800 rounded-xl fade-in">
                <label class="text-[11px] text-zinc-400 font-bold uppercase tracking-wider">Shareable Direct Download Link:</label>
                <div class="flex gap-2">
                    <input type="text" id="shareLink" readonly class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-xs text-red-400 font-mono focus:outline-none">
                    <button onclick="copyLink('shareLink')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1">
                        <i class="fa-solid fa-copy"></i> Copy
                    </button>
                </div>
            </div>

            <!-- LOCAL STORAGE VAULT -->
            <div class="pt-4 border-t border-zinc-800">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-clock-rotate-left text-red-500"></i> Local Storage Vault
                    </h3>
                    <button onclick="clearHistory()" class="text-[10px] text-zinc-500 hover:text-red-400 transition">Clear All</button>
                </div>

                <div id="historyList" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                    <!-- Dynamic items -->
                </div>
            </div>
        </div>

        <!-- DOWNLOADER VIEW -->
        <div id="downloadView" class="hidden text-center space-y-5 fade-in">
            <div class="p-5 bg-zinc-950 border border-zinc-800 rounded-xl">
                <i class="fa-solid fa-file-zipper text-4xl text-red-500 mb-3 animate-bounce"></i>
                <h3 class="text-sm font-bold text-zinc-100 break-all" id="dlFileName">Loading File...</h3>
                <p class="text-xs text-zinc-500 mt-1">Direct Download Trigger</p>
            </div>

            <p class="text-xs text-zinc-400">
                Your download starts automatically in <span id="timer" class="text-red-500 font-bold text-sm">3</span>s...
            </p>

            <a id="manualDlBtn" href="#" class="inline-block w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-red-900/20 active:scale-95">
                <i class="fa-solid fa-download mr-1.5"></i> Download File Now
            </a>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // ROUTER: Process Direct Download Route
        if (token) {
            document.getElementById('uploadView').classList.add('hidden');
            document.getElementById('downloadView').classList.remove('hidden');
            setupDownloadRoute(token);
        } else {
            renderHistory();
        }

        // Drag & Drop Handlers
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-red-500'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-red-500'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-red-500');
            if (e.dataTransfer.files.length) handleUpload(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleUpload(e.target.files[0]); });

        // CORS-friendly Upload Handler (catbox.moe API)
        function handleUpload(file) {
            if (!file) return;

            document.getElementById('progressBox').classList.remove('hidden');
            document.getElementById('fileName').innerText = file.name;

            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://catbox.moe/user/api.php', true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progressBar').style.width = percent + '%';
                    document.getElementById('percentText').innerText = percent + '%';
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200 && xhr.responseText.startsWith('http')) {
                    const directFileUrl = xhr.responseText.trim(); 
                    const fileCode = directFileUrl.split('/').pop(); 
                    
                    // Formatted token: fileCode|BrutalForce|Filename
                    const formattedToken = `${fileCode}BrutalForce/${encodeURIComponent(file.name)}`;
                    const fullShareUrl = `${window.location.origin}${window.location.pathname}?token=${formattedToken}`;

                    document.getElementById('shareLink').value = fullShareUrl;
                    document.getElementById('resultBox').classList.remove('hidden');
                    
                    saveToLocalStorage(fileCode, file.name, fullShareUrl);
                    renderHistory();
                } else {
                    alert('Upload failed: ' + xhr.responseText);
                }
            };

            xhr.onerror = () => alert('Network Error during upload.');
            xhr.send(formData);
        }

        // Parse token route
        function setupDownloadRoute(tokenPath) {
            const parts = tokenPath.split('BrutalForce/');
            const fileCode = parts[0];
            const rawFileName = parts[1] || 'Brutal_Force_File';
            const fileName = decodeURIComponent(rawFileName);

            const directApiUrl = `https://files.catbox.moe/${fileCode}`;
            document.getElementById('dlFileName').innerText = fileName;
            document.getElementById('manualDlBtn').href = directApiUrl;

            let seconds = 3;
            const interval = setInterval(() => {
                seconds--;
                document.getElementById('timer').innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.href = directApiUrl;
                }
            }, 1000);
        }

        // Local Storage Vault Logic
        function getStorageData() {
            return JSON.parse(localStorage.getItem('brutal_uploads') || '[]');
        }

        function saveToLocalStorage(id, name, link) {
            const history = getStorageData();
            history.unshift({ id, name, link, date: new Date().toLocaleDateString() });
            localStorage.setItem('brutal_uploads', JSON.stringify(history));
        }

        function renderHistory() {
            const history = getStorageData();
            const container = document.getElementById('historyList');
            container.innerHTML = '';

            if (history.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-zinc-600 py-3">No saved links in local vault</p>`;
                return;
            }

            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "bg-zinc-950 p-2.5 rounded-lg border border-zinc-800 flex items-center justify-between text-xs space-x-2";
                div.innerHTML = `
                    <div class="truncate max-w-[170px]">
                        <p class="text-zinc-200 font-bold truncate">${item.name}</p>
                        <p class="text-[10px] text-zinc-500 font-mono">${item.date}</p>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <button onclick="copyText('${item.link}')" title="Copy Link" class="text-zinc-400 hover:text-white p-1"><i class="fa-solid fa-copy"></i></button>
                        <button onclick="renameFile(${index})" title="Rename Link Name" class="text-zinc-400 hover:text-yellow-400 p-1"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteFile(${index})" title="Delete" class="text-zinc-400 hover:text-red-500 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renameFile(index) {
            const history = getStorageData();
            const newName = prompt("Enter new name for local vault record:", history[index].name);
            if (newName && newName.trim() !== "") {
                history[index].name = newName.trim();
                const updatedToken = `${history[index].id}BrutalForce/${encodeURIComponent(newName.trim())}`;
                history[index].link = `${window.location.origin}${window.location.pathname}?token=${updatedToken}`;
                localStorage.setItem('brutal_uploads', JSON.stringify(history));
                renderHistory();
            }
        }

        function deleteFile(index) {
            const history = getStorageData();
            history.splice(index, 1);
            localStorage.setItem('brutal_uploads', JSON.stringify(history));
            renderHistory();
        }

        function clearHistory() {
            if (confirm("Clear all items from local vault?")) {
                localStorage.removeItem('brutal_uploads');
                renderHistory();
            }
        }

        function copyLink(elementId) {
            copyText(document.getElementById(elementId).value);
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('Link copied to clipboard!');
        }
    </script>
</body>
</html>
